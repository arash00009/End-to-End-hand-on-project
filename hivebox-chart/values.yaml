replicaCount: 3

image:
  repository: hivebox
  tag: v0.3.0
  pullPolicy: Never

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /

env:
  senseboxIds: "5eba5fbad46fb8001b799786,5c21ff8f919bf8001adf2488,5ade1acf223bd80019a1011c"
  redisHost: "valkey"
  redisPort: "6379"
  minioHost: "minio:9000"
  minioAccessKey: "minioadmin"
  minioSecretKey: "minioadmin123"
  minioBucket: "hivebox-data"

readinessProbe:
  path: /readyz
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5
